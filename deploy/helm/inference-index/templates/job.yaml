apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-rank
  labels:
    app.kubernetes.io/name: inference-index
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference-index
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
      containers:
        - name: index
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --workload
            - {{ .Values.workloadFile | quote }}
            - --dataset
            - {{ .Values.datasetFile | quote }}
          resources:
{{ toYaml .Values.resources | indent 12 }}

